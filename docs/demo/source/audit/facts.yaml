  - {id: F-24, slides: ["05"], label: "Cancel if nothing has left the hub", shown: "cancel after 45 min", type: direct, source: "src/last_mile_dispatch/config.py:28", key: "CANCEL_AFTER_MIN = 45", formula: "-",

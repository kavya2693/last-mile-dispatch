# Audit facts for the last-mile-dispatch demo video.
# Read by ~/Work/hyperframes/demos/tools/build_audit_report.py.
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: last-mile-dispatch
  title: "last-mile-dispatch: demo video audit report"
  repo_url: https://github.com/kavya2693/last-mile-dispatch
  repo_dir: ../../../..
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 87.0
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [numpy, pandas, scipy]
  regenerate:
    - "make run                                   # data/ (seed 7) and outputs/*.csv, summary.json, run_log.txt (~3 min)"
    - "python3 docs/demo/source/tools/export_series.py docs/demo/source/assets/run_series.json"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_rider_board.py docs/demo/source/assets/rider_board.json"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/rider_board.json docs/demo/source/compositions/value.html --name SHEET"
    - "for f in s02-hook s04-routes s07-end; do python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/run_series.json docs/demo/source/compositions/$f.html --name SERIES; done"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/last-mile-dispatch-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/last-mile-dispatch-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data: 7, hub_assignment: 2026, rerandomisation: 2027, simulator: "hub_id * 10000 + day index (same for every policy)"}
  run_time: "summary.json runtime_s = 179.8 s (about 3 min) for make run with 4 workers on the author's laptop"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem (26 hubs, 473 riders, 42 days, 477,868 orders). Production dispatch data is proprietary."
    source: "scripts/generate_data.py:9, :168 (seed 7); src/last_mile_dispatch/config.py:11-18; README 'The data'"
    figures: [F-03, F-04, F-05, F-06]
    all_figures: true
    edit: ["scripts/generate_data.py", "src/last_mile_dispatch/config.py"]
    rerun: ["make data", "make run"]
  - id: A-02
    statement: "The rider roster is fixed and sized for an ordinary weekday evening; every policy pays for the same riders. Cost savings therefore come mostly from cancelled orders turned into deliveries, and utilisation falls."
    source: "scripts/generate_data.py:84-85 (make_riders); README 'Known limitations' (the biggest gap)"
    figures: [F-04, F-33, F-34, F-35, F-36, F-37, F-44, F-45, F-53, F-54, F-55, F-56, F-62, F-63, F-69]
    edit: ["scripts/generate_data.py:84-85"]
    rerun: ["make data", "make run"]
  - id: A-03
    statement: "Travel is straight-line distance x 1.35 at an hour-dependent speed (bike 24 km/h, car 22 km/h; peaks x0.68-0.88, rain x0.6), not a road graph; riders return to the hub between trips."
    source: "src/last_mile_dispatch/config.py:13, :36; geo.py:29-46; simulate.py:247-249; README 'Known limitations'"
    figures: [F-32, F-33, F-34, F-35, F-36, F-37, F-39, F-44, F-45, F-46, F-47]
    edit: ["src/last_mile_dispatch/config.py:13, :36", "src/last_mile_dispatch/geo.py:29-41"]
    rerun: ["make run", "export_rider_board.py + inject_sheet.py"]
  - id: A-04
    statement: "Matching prices each rider-bag pair in AED: km cost of the vehicle, 1.0 per minute late, minus 1.4 per minute already waited, minus a 9.0 credit per order. The matcher is myopic (one 2-minute wave at a time)."
    source: "src/last_mile_dispatch/config.py:74-76; assignment.py:46-58; README 'Known limitations'"
    figures: [F-14, F-33, F-34, F-39, F-44, F-45, F-46, F-47, F-48]
    edit: ["src/last_mile_dispatch/config.py:74-76"]
    rerun: ["make run", "export_rider_board.py + inject_sheet.py"]
  - id: A-05
    statement: "Bagging limits: drops within 1 km and created within 12 minutes of the seed order, at most 3 stops, and the first customer may wait at most 9 extra minutes."
    source: "src/last_mile_dispatch/config.py:37, :65-67; bagging.py:51-87"
    figures: [F-15, F-16, F-17, F-39, F-41]
    edit: ["src/last_mile_dispatch/config.py:37, :65-67"]
    rerun: ["make run", "export_rider_board.py + inject_sheet.py"]
  - id: A-06
    statement: "Geofence rule: a 'customer unavailable' mark is flagged when fewer than 2 of the rider's last 6 GPS pings are within 150 m of the customer; flagged riders are sent back to the door (treatment) or the flag is only logged (baseline)."
    source: "src/last_mile_dispatch/config.py:43, :79-80; geofence.py:31-39; simulate.py:218-230"
    figures: [F-21, F-25, F-49, F-50]
    edit: ["src/last_mile_dispatch/config.py:79-80"]
    rerun: ["make run"]
  - id: A-07
    statement: "Fake marks: about 8% of riders (36 of 473 in the data) mark 'customer unavailable' without reaching the door on 22% of their stops; fakes are known by construction and riders do not change habit when flagged."
    source: "src/last_mile_dispatch/config.py:40-41; scripts/generate_data.py:94; README 'Known limitations'"
    figures: [F-10, F-21, F-49, F-50]
    edit: ["src/last_mile_dispatch/config.py:40-41"]
    rerun: ["make data", "make run"]
  - id: A-08
    statement: "Service promise 30 minutes from order creation; a customer cancels if nothing has left the hub after 45 minutes; the dispatcher wakes every 2 minutes; 2 minutes handover per stop."
    source: "src/last_mile_dispatch/config.py:23, :27-29"
    figures: [F-07, F-08, F-24, F-32, F-33, F-34, F-42, F-46, F-47, F-48]
    edit: ["src/last_mile_dispatch/config.py:23-29"]
    rerun: ["make run", "export_rider_board.py + inject_sheet.py"]
  - id: A-09
    statement: "Experiment design: hubs sorted by pre-period orders per day, paired, one coin flip per pair (seed 2026); one number per hub over four weeks; Welch t and hub-bootstrap 95% intervals; power from the pre-period between-hub spread."
    source: "src/last_mile_dispatch/cli.py:22, :58-98; experiment.py:20-124"
    figures: [F-27, F-44, F-45, F-46, F-47, F-48, F-49, F-50, F-52, F-53, F-54, F-55, F-56, F-57, F-62, F-63, F-64, F-65, F-66, F-67, F-68]
    edit: ["src/last_mile_dispatch/cli.py:22", "src/last_mile_dispatch/experiment.py"]
    rerun: ["make run"]
  - id: A-10
    statement: "Calendar: two pre-period weeks from 2026-01-19, then four experiment weeks 2026-02-02 to 2026-03-01; weekends are Saturday-Sunday; Ramadan from 2026-02-18; one rain day 2026-02-07 (35% more orders, 40% slower traffic)."
    source: "src/last_mile_dispatch/config.py:16-18; scripts/generate_data.py:35-36; README 'The data'"
    figures: [F-06, F-09, F-13, F-31, F-32, F-35, F-36, F-37, F-38, F-40]
    edit: ["src/last_mile_dispatch/config.py:16-18", "scripts/generate_data.py:35-36"]
    rerun: ["make data", "make run"]
  - id: A-11
    statement: "The rider board (slide 07) re-runs the repo's own simulator for hub 18 on 2026-02-14 under the treatment and records the 21:46 wave; drop ETAs replay the simulator's clock with geo.travel_min for riders who are honest and customers who are home."
    source: "docs/demo/source/tools/export_rider_board.py; simulate.py:189-253"
    figures: [F-39, F-40, F-41, F-42]
    edit: ["docs/demo/source/tools/export_rider_board.py (hub, date, wave arguments)"]
    rerun: ["export_rider_board.py + inject_sheet.py", "hyperframes render"]
  - id: A-12
    statement: "Video rounding: percentages to 1 decimal, AED to 2 decimals, utilisation and CI bounds to 3 decimals, counts with thousands separators; '~3 min' and '180 s' are rounded run times."
    source: "this audit (display convention)"
    figures: [F-16, F-17, F-23, F-32, F-34, F-35, F-36, F-37, F-44, F-45, F-46, F-47, F-48, F-49, F-50, F-53, F-54, F-55, F-59, F-62, F-63, F-66]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-13
    statement: "Slide 01 (industries, everyday problems) is general delivery-operations knowledge used as context. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' supports problems 1-4"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Industries that relate: quick-commerce grocery, food & restaurant delivery, parcel & pharmacy couriers", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (one order per trip by hand; peaks outrun riders; 'customer unavailable' from the road; before-and-after judging)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem', 'Insights and learning'", key: "README text", formula: "-",
     check: {expr: "all(grep('README.md', p) for p in [r'one order\\s+per trip', r'orders pile up faster than riders', r'customer unavailable', r'before-and-after'])", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "07"], label: "Hubs", shown: "26 hubs", type: direct, source: "outputs/summary.json; data/hubs.csv", key: "hubs; row count", formula: "-",
     check: {expr: "J('outputs/summary.json')['hubs'] if len(R('data/hubs.csv')) == J('outputs/summary.json')['hubs'] else -1", fmt: "{:d}", expect: "26"}}
  - {id: F-04, slides: ["02", "05"], label: "Riders", shown: "473 riders", type: direct, source: "data/riders.csv", key: "row count", formula: "-",
     check: {expr: "len(R('data/riders.csv'))", fmt: "{:d}", expect: "473"}}
  - {id: F-05, slides: ["02", "05"], label: "Orders in the dataset (pre-period + experiment)", shown: "477,868 orders", type: direct, source: "data/orders.csv.gz", key: "row count", formula: "-",
     check: {expr: "len(R('data/orders.csv.gz'))", fmt: "{:,d}", expect: "477,868"}}
  - {id: F-06, slides: ["02", "05"], label: "Length of the dataset", shown: "6 weeks / 42 days", type: derived, source: "data/days.csv", key: "row count = 42", formula: "42 / 7 = 6 weeks",
     check: {expr: "len(R('data/days.csv'))", fmt: "{:d} days", expect: "42 days"}}
  - {id: F-07, slides: ["02", "07"], label: "Delivery promise", shown: "30 minutes to each door / 30-minute promise", type: direct, source: "src/last_mile_dispatch/config.py:27", key: "SLA_MIN = 30", formula: "-",
     check: {expr: "grep('src/last_mile_dispatch/config.py', r'^SLA_MIN = 30\\b')", fmt: bool}}
  - {id: F-08, slides: ["02", "03", "05"], label: "Dispatch wave interval", shown: "riders sent out every 2 min / EVERY 2 MINUTES / dispatch wave 2 min", type: direct, source: "src/last_mile_dispatch/config.py:23", key: "WAVE_MIN = 2", formula: "-",
     check: {expr: "grep('src/last_mile_dispatch/config.py', r'^WAVE_MIN = 2\\b')", fmt: bool}}
  - {id: F-09, slides: ["02"], label: "Ramadan, weekends and a rain day are in the calendar", shown: "Ramadan · weekends · rain", type: direct, source: "data/days.csv", key: "ramadan, weekend, rain columns", formula: "any ramadan, any weekend, exactly one rain day",
     check: {expr: "(lambda d: bool(d['ramadan'].any()) and bool(d['weekend'].any()) and int(d['rain'].sum()) == 1)(R('data/days.csv'))", fmt: bool}}
  - {id: F-10, slides: ["02"], label: "Riders who sometimes mark 'not home' without reaching the door", shown: "36 riders sometimes skip doors", type: direct, source: "data/riders.csv", key: "remote_marker == True", formula: "count",
     check: {expr: "int(R('data/riders.csv')['remote_marker'].sum())", fmt: "{:d}", expect: "36"}}
  - {id: F-11, slides: ["02", "10"], label: "Background map: the 26 real hub positions with their 4 km service radius", shown: "hub dots + circles", type: direct, source: "data/hubs.csv; config.py:12 (SERVICE_RADIUS_KM = 4.0)", key: "lat/lon -> km from the centroid (demo assets/run_series.json)", formula: "-",
     check: {expr: "grep('src/last_mile_dispatch/config.py', r'^SERVICE_RADIUS_KM = 4.0') and len(J('demo:assets/run_series.json')['hubs']) == 26 and series_injected('compositions/s02-hook.html') and series_injected('compositions/s07-end.html')", fmt: bool}}
  # ---- slide 03
  - {id: F-12, slides: ["03"], label: "Each flow block exists in the code (bag, match, door check, A/B test)", shown: "ORDERS → BAG → MATCH → DOOR CHECK → A/B TEST → VERDICT", type: direct, source: "src/last_mile_dispatch/", key: "functions", formula: "-",
     check: {expr: "all(grep('src/last_mile_dispatch/' + f, p) for f, p in [('bagging.py', r'def make_bags'), ('assignment.py', r'def min_cost'), ('geofence.py', r'def flag_attempts'), ('experiment.py', r'def readout')])", fmt: bool}}
  - {id: F-13, slides: ["03", "08", "09"], label: "The A/B test runs four weeks", shown: "4 WEEKS / over 4 weeks / 4 weeks", type: derived, source: "outputs/summary.json", key: "experiment_days = 28", formula: "28 / 7 = 4",
     check: {expr: "J('outputs/summary.json')['experiment_days'] // 7", fmt: "{:d} weeks", expect: "4 weeks"}}
  - {id: F-14, slides: ["03"], label: "Verdict badges: cheaper orders, fewer cancels, fewer fake marks (treatment vs control, Welch 95% CI below zero)", shown: "cheaper orders / fewer cancels / fewer fake marks", type: derived, source: "outputs/ab_readout.csv", key: "welch_hi for cost_per_delivered, cancel_rate, fake_accepted_per_1k", formula: "welch_hi < 0 for all three",
     check: {expr: "all(row('outputs/ab_readout.csv', metric=m)['welch_hi'] < 0 for m in ['cost_per_delivered', 'cancel_rate', 'fake_accepted_per_1k'])", fmt: bool}}
  # ---- slide 04
  - {id: F-15, slides: ["04", "05"], label: "Bag rule: oldest order seeds the bag; close drops created around the same time join; up to 3 stops; first customer barely waits longer", shown: "3 steps / ≤ 3 stops · 1 km", type: direct, source: "src/last_mile_dispatch/bagging.py:3-5, :51-87; config.py:37, :65-67", key: "BAG_CAPACITY = 3, BAG_MAX_DROP_GAP_KM = 1.0, BAG_MAX_CREATED_GAP_MIN = 12.0, BAG_MAX_EXTRA_MIN = 9.0", formula: "-",
     check: {expr: "grep('src/last_mile_dispatch/bagging.py', r'Greedy by age') and all(grep('src/last_mile_dispatch/config.py', p) for p in [r'^BAG_CAPACITY = 3\\b', r'^BAG_MAX_DROP_GAP_KM = 1.0', r'^BAG_MAX_CREATED_GAP_MIN = 12.0', r'^BAG_MAX_EXTRA_MIN = 9.0'])", fmt: bool}}
  - {id: F-16, slides: ["04"], label: "Cost per delivered order, FIFO baseline (ablation, all hubs, all experiment days)", shown: "9.71", type: direct, source: "outputs/ablation.csv", key: "policy=baseline, cost_per_delivered", formula: "-",
     check: {expr: "R('outputs/ablation.csv').set_index('Unnamed: 0').at['baseline', 'cost_per_delivered']", fmt: "{:.2f}", expect: "9.71"}}
  - {id: F-17, slides: ["04"], label: "Cost per delivered order, bagging only", shown: "8.95 AED", type: direct, source: "outputs/ablation.csv", key: "policy=bagging, cost_per_delivered", formula: "-",
     check: {expr: "R('outputs/ablation.csv').set_index('Unnamed: 0').at['bagging', 'cost_per_delivered']", fmt: "{:.2f}", expect: "8.95"}}
  # ---- slide 05
  - {id: F-18, slides: ["05"], label: "Every architecture box names a real file/function", shown: "generate_data.py, runner.py run_all(), simulate.py simulate_hub_day(), bagging.py, assignment.py (min_cost, fifo), geo.py, geofence.py, experiment.py, report.py", type: direct, source: "src/last_mile_dispatch/, scripts/", key: "defs", formula: "-",
     check: {expr: "all(grep(f, p) for f, p in [('scripts/generate_data.py', r'def main'), ('src/last_mile_dispatch/runner.py', r'def run_all'), ('src/last_mile_dispatch/simulate.py', r'def simulate_hub_day'), ('src/last_mile_dispatch/simulate.py', r'class Result'), ('src/last_mile_dispatch/bagging.py', r'def make_bags'), ('src/last_mile_dispatch/assignment.py', r'def min_cost'), ('src/last_mile_dispatch/assignment.py', r'def fifo'), ('src/last_mile_dispatch/assignment.py', r'linear_sum_assignment'), ('src/last_mile_dispatch/geo.py', r'def travel_min'), ('src/last_mile_dispatch/geofence.py', r'def flag_attempts'), ('src/last_mile_dispatch/geofence.py', r'def evaluate'), ('src/last_mile_dispatch/geofence.py', r'def radius_sweep'), ('src/last_mile_dispatch/experiment.py', r'def paired_stratified_assignment'), ('src/last_mile_dispatch/experiment.py', r'def readout'), ('src/last_mile_dispatch/experiment.py', r'def rerandomisation_check'), ('src/last_mile_dispatch/report.py', r'def pooled_by_policy'), ('src/last_mile_dispatch/report.py', r'def stress_split'), ('src/last_mile_dispatch/config.py', r'class Policy')])", fmt: bool}}
  - {id: F-19, slides: ["05"], label: "Output files named under the evaluation boxes exist", shown: "power.csv, ab_readout.csv, geofence_eval.csv, ablation.csv, rerandomisation.csv, hub_day_metrics.csv", type: direct, source: "outputs/", key: "files", formula: "-",
     check: {expr: "all(len(R('outputs/' + f)) > 0 for f in ['power.csv', 'ab_readout.csv', 'geofence_eval.csv', 'ablation.csv', 'rerandomisation.csv', 'hub_day_metrics.csv'])", fmt: bool}}
  - {id: F-20, slides: ["05"], label: "Rows in hub_day_metrics.csv (26 hubs x 28 days x 5 policies)", shown: "3,640 rows", type: direct, source: "outputs/hub_day_metrics.csv", key: "row count", formula: "26 x 28 x 5",
     check: {expr: "len(R('outputs/hub_day_metrics.csv'))", fmt: "{:,d}", expect: "3,640"}}
  - {id: F-21, slides: ["05"], label: "'Not home' marks judged by the geofence evaluation (baseline arm)", shown: "11,566 marks", type: direct, source: "outputs/geofence_eval.csv", key: "slice=all, events", formula: "-",
     check: {expr: "int(row('outputs/geofence_eval.csv', slice='all')['events'])", fmt: "{:,d}", expect: "11,566"}}
  - {id: F-22, slides: ["05"], label: "Hub-day-policy runs simulated (pre-period baseline + all experiment policies)", shown: "hub-day runs 4,004", type: direct, source: "outputs/run_log.txt line 2", key: "'simulated 4,004 hub-day-policy runs'", formula: "26 x 14 + 26 x 28 x 5 = 4,004",

# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  def _block(path, name):
      html = T('demo:' + path)
      m = _re.search(r"const " + name + r" = (\{.*?\}); /\* " + name + r":END", html, _re.S)
      return json.loads(m.group(1)) if m else None
  def series_injected(path):
      """The SERIES block in a composition must equal the exported run_series.json."""
      return _block(path, 'SERIES') == J('demo:assets/run_series.json')
  def series_daily_matches():
      """Recompute the daily cancellation rates from hub_day_metrics.csv and compare with the injected chart data."""
      if not series_injected('compositions/s04-routes.html'):
          return False
      m = R('outputs/hub_day_metrics.csv')
      g = m.groupby(['date', 'policy'])[['orders', 'cancelled']].sum()
      d = J('demo:assets/run_series.json')['daily']
      exp = R('data/days.csv').query("period == 'experiment'")['date'].tolist()
      if [x['date'] for x in d] != exp:
          return False
      for x in d:
          for k, p in (('base', 'baseline'), ('treat', 'bagging+matching+geofence')):
              if round(g.at[(x['date'], p), 'cancelled'] / g.at[(x['date'], p), 'orders'], 4) != x[k]:
                  return False
      return True
  def stress_line(day_type):
      b = row('outputs/stress_split.csv', day_type=day_type, policy='baseline')
      t = row('outputs/stress_split.csv', day_type=day_type, policy='bagging+matching+geofence')
      s = J('demo:assets/run_series.json')['stress']
      if not series_injected('compositions/s04-routes.html'):
          return 'not injected'
      chg = (t['cost_per_delivered'] / b['cost_per_delivered'] - 1) * 100
      shown = next(r for r in s if r['day_type'] == day_type)
      if round(chg, 1) != shown['cost_chg_pct']:
          return 'export mismatch'
      return '{:,d} · {:.2f} → {:.2f} · {:+.1f}%'.format(int(b['orders']), b['cost_per_delivered'], t['cost_per_delivered'], chg)
  def sheet_rows_match():
      """The SHEET block injected in value.html must equal the exported rider board, and the board's
      hub-day totals must equal outputs/hub_day_metrics.csv."""
      sheet = _block('compositions/value.html', 'SHEET')
      src = J('demo:assets/rider_board.json')
      if sheet != src:
          return False
      for p, v in src['day'].items():
          r = row('outputs/hub_day_metrics.csv', hub_id=src['hub'], date=src['date'], policy=p)
          if any(int(r[k]) != v[k] for k in ('orders', 'delivered', 'cancelled', 'on_time')):
              return False
      shown = [(r['rider'], r['orders'], f"{r['km']:.1f}", round(r['waited_min']), r['leaves'], r['first_eta'], r['last_eta'], r['due'], r['back']) for r in src['rows']]
      return shown == [
          ('Rider 01', 2, '5.1', 13, '21:46', '21:50', '21:55', '22:03', '22:02'),
          ('Rider 02', 1, '1.9', 8, '21:46', '21:48', '21:48', '22:08', '21:52'),
          ('Rider 03', 3, '2.8', 10, '21:46', '21:46', '21:53', '22:06', '21:59'),
          ('Rider 04', 1, '10.8', 14, '21:46', '21:59', '21:59', '22:02', '22:15'),
          ('Rider 05', 2, '5.4', 15, '21:46', '21:50', '21:54', '22:01', '22:03'),
      ]

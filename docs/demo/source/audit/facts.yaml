  - {id: F-25, slides: ["05"], label: "Geofence radius", shown: "150 m geofence", type: direct, source: "src/last_mile_dispatch/config.py:79", key: "GEOFENCE_RADIUS_M = 150.0", formula: "-",
     check: {expr: "grep('src/last_mile_dispatch/config.py', r'^GEOFENCE_RADIUS_M = 150.0')", fmt: bool}}
  - {id: F-26, slides: ["05", "09"], label: "Re-randomisation draws", shown: "500 re-draws / Test re-run 500 times", type: direct, source: "outputs/rerandomisation.csv", key: "draws", formula: "-",
     check: {expr: "int(R('outputs/rerandomisation.csv')['draws'].unique()[0]) if R('outputs/rerandomisation.csv')['draws'].nunique() == 1 else -1", fmt: "{:d}", expect: "500"}}
  - {id: F-27, slides: ["05", "08", "09"], label: "Hubs per arm", shown: "13 vs 13 hubs", type: direct, source: "outputs/summary.json", key: "arms.treatment, arms.control", formula: "len of each list",
     check: {expr: "'{} vs {}'.format(len(J('outputs/summary.json')['arms']['treatment']), len(J('outputs/summary.json')['arms']['control']))", fmt: "{}", expect: "13 vs 13"}}
  - {id: F-28, slides: ["05"], label: "Worker processes, policies and shared seed", shown: "4 parallel workers · 5 policies, 1 seed", type: direct, source: "src/last_mile_dispatch/cli.py:29; runner.py:36-41; config.py:62", key: "--workers default 4; same seed for every policy; ALL_POLICIES", formula: "-",
     check: {expr: "grep('src/last_mile_dispatch/cli.py', r'--workers\", type=int, default=4') and grep('src/last_mile_dispatch/runner.py', r'Same seed for every policy') and len(R('outputs/ablation.csv')) == 5", fmt: bool}}
  - {id: F-29, slides: ["05"], label: "CI slice", shown: "CI slice 8 hubs × 7 d", type: direct, source: "src/last_mile_dispatch/cli.py:38, :40; .github/workflows/ci.yml", key: "hubs.head(8), experiment days head(7)", formula: "-",
     check: {expr: "grep('src/last_mile_dispatch/cli.py', r'hubs\\.head\\(8\\)') and grep('src/last_mile_dispatch/cli.py', r'\\.head\\(7\\)') and grep('.github/workflows/ci.yml', r'dispatch --quick')", fmt: bool}}
  - {id: F-30, slides: ["05"], label: "Generator seed", shown: "generate_data.py · seed 7", type: direct, source: "scripts/generate_data.py:168", key: "--seed default 7", formula: "-",
     check: {expr: "grep('scripts/generate_data.py', r'\"--seed\", type=int, default=7')", fmt: bool}}

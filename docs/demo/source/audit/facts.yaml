  - {id: F-31, slides: ["06"], label: "Daily cancellation rate, all hubs pooled, FIFO baseline vs treatment (28 points per line)", shown: "two lines, Feb 2 - Mar 1", type: derived, source: "outputs/hub_day_metrics.csv", key: "sum(cancelled) / sum(orders) by date and policy", formula: "injected SERIES block must equal the recomputation",
     check: {expr: "series_daily_matches()", fmt: bool}}
